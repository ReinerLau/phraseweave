name: 🚀 新需求
title: "[需求] "
description: 用自然语言描述希望页面产生的变化
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        不需要描述代码。请说明谁在什么场景下，希望看到什么结果，以及怎样算完成。
  - type: textarea
    id: feature-description
    attributes:
      label: 需求与使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: 期望的页面行为
      description: 用户操作后，页面应该出现什么变化？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 应看到……
    validations:
      required: true
  - type: textarea
    validations:
      required: false
    attributes:
      label: 不包含的内容
      description: 明确这次不做什么，避免范围持续扩大。
  - type: textarea
    attributes:
      label: 截图或录屏
      description: |
        If applicable, add screenshots or a video to help explain your problem.
        For more information on the supported file image/file types and the file size limits, please refer
        to the following link: https://docs.github.com/en/github/writing-on-github/working-with-advanced-formatting/attaching-files
      placeholder: |
        You can drag your video or image files inside of this editor ↓
  - type: textarea
    id: additional-context
    attributes:
      label: 验收标准
      description: 请用可以在测试页面上实际操作、观察的方式描述。
      placeholder: |
        - [ ] 当我……时，页面会……
        - [ ] 刷新页面后……
    validations:
      required: false
