name: 🚀 新需求
title: "[需求] "
description: 保存已经完成计划的产品需求
labels: [ready-for-agent, status:in-progress]
body:
  - type: markdown
    attributes:
      value: |
        这个模板用于保存已经完成 Plan Mode 的交付计划。请在用户确认“开始开发”后创建 Issue，并完整填写计划。
  - type: textarea
    id: feature-description
    attributes:
      label: 需求与使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: implementation-plan
    attributes:
      label: 完整实现计划
      description: 粘贴 Plan Mode 生成的完整计划，包括关键改动、接口、边界、测试、发布和假设。
      placeholder: |
        ## Summary
        ## Implementation changes
        ## Tests and acceptance
        ## Assumptions
    validations:
      required: true
  - type: textarea
    id: scope-exclusions
    attributes:
      label: 范围外
      description: 明确这次不做什么，避免范围持续扩大。
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 用户验收标准
      description: 请用可以在固定 /preview/ 页面实际操作和观察的方式描述。
      placeholder: |
        - [ ] 当我……时，页面会……
        - [ ] 刷新页面后……
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 其他上下文
      description: 补充截图、录屏、依赖或已知风险。
