name: 🚀 新需求
title: "[需求] "
description: 记录产品需求或改进想法
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 需求与使用场景
      description: 谁在什么情况下遇到了什么问题？希望得到什么改进？
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: 期望结果
      description: 用自然语言描述完成后希望看到的结果。
  - type: textarea
    id: additional-context
    attributes:
      label: 其他上下文
      description: 补充截图、录屏、依赖或已知风险。
