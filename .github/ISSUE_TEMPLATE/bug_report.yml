name: 🐞 页面问题
title: "[问题] "
description: 记录页面问题或异常行为
body:
  - type: textarea
    id: bug-description
    attributes:
      label: 实际表现与期望表现
      description: 页面上看到了什么问题？期望的表现是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如果问题可以稳定复现，请描述操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
