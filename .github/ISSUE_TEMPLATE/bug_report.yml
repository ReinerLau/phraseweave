name: 🐞 页面问题
title: "[问题] "
description: 描述实际页面表现与预期表现
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        不需要提供代码。请描述可以在页面上重复的问题。
  - type: textarea
    id: bug-description
    attributes:
      label: 实际发生了什么
      description: 页面上看到了什么错误或异常行为？
      placeholder: 实际结果
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从打开哪个页面开始，依次做了什么？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: 提交前确认
      description: 帮助我们准确验收修复
      options:
        - label: 我已经写明期望的正确表现。
          required: true
        - label: 我确认目前没有重复 Issue。
          required: true
