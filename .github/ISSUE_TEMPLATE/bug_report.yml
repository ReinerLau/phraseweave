name: 🐞 页面问题
title: "[问题] "
description: 保存已经完成计划的缺陷修复
labels: [ready-for-agent, status:in-progress]
body:
  - type: markdown
    attributes:
      value: |
        这个模板用于保存已经完成 Plan Mode 的修复计划。请在用户确认“开始开发”后创建 Issue，并完整填写计划。
  - type: textarea
    id: bug-description
    attributes:
      label: 实际表现与期望表现
      description: 页面上看到了什么错误或异常行为？正确表现应该是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从打开哪个页面开始，依次做了什么？
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: implementation-plan
    attributes:
      label: 完整实现计划
      description: 粘贴 Plan Mode 生成的完整修复计划，包括根因、改动、测试、发布和假设。
      placeholder: |
        ## Summary
        ## Root cause and implementation changes
        ## Tests and acceptance
        ## Assumptions
    validations:
      required: true
  - type: checkboxes
    id: checkboxes
    attributes:
      label: 提交前确认
      description: 帮助我们准确验收修复
      options:
        - label: 我确认目前没有重复 Issue。
          required: true
