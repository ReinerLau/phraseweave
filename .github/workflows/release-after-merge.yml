name: Release every merged PR

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-after-merge
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Tag untagged main commits and start package releases
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RELEASE_TOKEN:-}" ]]; then
            echo "::error::Configure the RELEASE_TOKEN repository secret before enabling automatic releases."
            exit 1
          fi

          latest_version_tag() {
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                printf '%s\n' "$tag"
                return 0
              fi
            done < <(git tag --list 'v[0-9]*' --sort=-version:refname)
            return 1
          }

          tag_at_commit() {
            local commit="$1"
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                printf '%s\n' "$tag"
                return 0
              fi
            done < <(git tag --points-at "$commit" --list 'v[0-9]*' --sort=-version:refname)
            return 1
          }

          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          base_tag="$(latest_version_tag)"
          git merge-base --is-ancestor "$base_tag" "$main_tip"
          mapfile -t commits < <(git rev-list --first-parent --reverse "$base_tag..$main_tip")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for commit in "${commits[@]}"; do
            release_tag=""
            for attempt in {1..5}; do
              git fetch origin +refs/heads/main:refs/remotes/origin/main --tags

              if release_tag="$(tag_at_commit "$commit")"; then
                break
              fi

              latest_tag="$(latest_version_tag)"
              version="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "$version"
              candidate="v${major}.${minor}.$((patch + 1))"

              if git show-ref --quiet --verify "refs/tags/$candidate"; then
                continue
              fi

              git tag -a "$candidate" "$commit" -m "PhraseWeave ${candidate#v}"
              if git push origin "$candidate"; then
                release_tag="$candidate"
                break
              fi

              git tag --delete "$candidate"
              git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
              if release_tag="$(tag_at_commit "$commit")"; then
                break
              fi
            done

            if [[ -z "$release_tag" ]]; then
              echo "Could not create a version tag for $commit after 5 attempts." >&2
              exit 1
            fi

            echo "Pushed $release_tag for $commit; the tag push starts the package release workflow."
          done
