name: Build macOS desktop launcher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing merged release tag (for example v1.0.10)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          echo "PHRASEWEAVE_DESKTOP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.12.2
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check launcher behavior
        run: pnpm desktop:test
      - name: Build launcher installer
        run: pnpm desktop:make:mac
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhraseWeave-macOS-${{ inputs.tag }}
          path: apps/desktop/out/make/*.pkg
          if-no-files-found: error
          retention-days: 7
      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" apps/desktop/out/make/*.pkg --clobber
