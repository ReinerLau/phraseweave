name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: pnpm
          cache-dependency-path: source-main/pnpm-lock.yaml
      - name: Install production dependencies
        run: pnpm --dir source-main install --frozen-lockfile
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set production build version
        run: echo "BUILD_VERSION=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
      - name: Build production
        run: pnpm --dir source-main build:client
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /phraseweave/
          DEPLOYMENT_ENVIRONMENT: production
          BACKEND_ENDPOINT: ""
          LOGTO_ENDPOINT: ""
          LOGTO_APP_ID: ""
          EXERCISE_SYNC_SIGNAL_URL: ${{ vars.EXERCISE_SYNC_SIGNAL_URL }}
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R source-main/apps/client/.output/public/. site/
          if [ -f source-main/.github/pages/404.html ]; then
            cp source-main/.github/pages/404.html site/404.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
