name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: pnpm
          cache-dependency-path: source-main/pnpm-lock.yaml
      - name: Resolve trusted production and tested preview revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PREVIEW_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          production_sha=$(git -C source-main rev-parse HEAD)
          preview_sha=""
          run_id=""
          has_preview="false"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            preview_sha="$EVENT_PREVIEW_SHA"
            run_id="$EVENT_RUN_ID"
          else
            while IFS=$'\t' read -r candidate_id candidate_sha; do
              artifact_name="preview-site-$candidate_sha"
              artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_id/artifacts" \
                --jq "[.artifacts[] | select(.name == \"$artifact_name\" and .expired == false)] | length")
              if [ "$artifact_count" -gt 0 ]; then
                run_id="$candidate_id"
                preview_sha="$candidate_sha"
                has_preview="true"
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=dev&event=push&status=success&per_page=100" \
              --jq '.workflow_runs[] | [.id, .head_sha] | @tsv')
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] && { [ -z "$run_id" ] || [ -z "$preview_sha" ]; }; then
            echo "No non-expired, successfully tested preview artifact is available." >&2
            exit 1
          fi

          if [ -n "$run_id" ] && [ -n "$preview_sha" ]; then
            has_preview="true"
          fi

          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          echo "preview_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "has_preview=$has_preview" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Install production dependencies
        run: pnpm --dir source-main install --frozen-lockfile
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set production build version
        run: echo "BUILD_VERSION=production-$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build production
        run: pnpm --dir source-main build:client
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /phraseweave/
          DEPLOYMENT_ENVIRONMENT: production
          BACKEND_ENDPOINT: ""
          LOGTO_ENDPOINT: ""
          LOGTO_APP_ID: ""
          EXERCISE_SYNC_SIGNAL_URL: ${{ vars.EXERCISE_SYNC_SIGNAL_URL }}
      - name: Download tested preview artifact
        if: steps.revisions.outputs.has_preview == 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-site-${{ steps.revisions.outputs.preview_sha }}
          path: preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.revisions.outputs.preview_run_id }}
      - name: Reject unsafe preview artifact entries
        if: steps.revisions.outputs.has_preview == 'true'
        run: |
          if find preview-artifact -type l -print -quit | grep -q .; then
            echo "Preview artifact contains a symbolic link." >&2
            exit 1
          fi
      - name: Assemble production and preview
        env:
          HAS_PREVIEW: ${{ steps.revisions.outputs.has_preview }}
        run: |
          mkdir -p site
          cp -R source-main/apps/client/.output/public/. site/
          if [ "$HAS_PREVIEW" = "true" ]; then
            mkdir -p site/preview
            cp -R preview-artifact/. site/preview/
          fi
          if [ -f source-main/.github/pages/404.html ]; then
            cp source-main/.github/pages/404.html site/404.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
