name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: pnpm
          cache-dependency-path: source-main/pnpm-lock.yaml
      - name: Resolve trusted production and tested preview revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          production_sha=$(git -C source-main rev-parse HEAD)
          preview_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=dev&event=push&status=success&per_page=100" \
            --jq "first(.workflow_runs[] | select(.head_sha == \"$preview_sha\")) | .id")

          if [ -z "$run_id" ]; then
            echo "No successful CI run found for current dev revision $preview_sha." >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.head_sha }}" != "$preview_sha" ]; then
            echo "Refusing to deploy stale preview ${{ github.event.workflow_run.head_sha }}; current dev is $preview_sha." >&2
            exit 1
          fi

          echo "production_sha=$production_sha" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          echo "preview_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Install production dependencies
        run: pnpm --dir source-main install --frozen-lockfile
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build production
        run: pnpm --dir source-main build:client
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /phraseweave/
          DEPLOYMENT_ENVIRONMENT: production
          BUILD_SHA: ${{ steps.revisions.outputs.production_sha }}
          BUILD_TIME: ${{ env.DEPLOYED_AT }}
          BACKEND_ENDPOINT: ""
          LOGTO_ENDPOINT: ""
          LOGTO_APP_ID: ""
          EXERCISE_SYNC_SIGNAL_URL: ${{ vars.EXERCISE_SYNC_SIGNAL_URL }}
      - name: Download tested preview artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-site-${{ steps.revisions.outputs.preview_sha }}
          path: preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.revisions.outputs.preview_run_id }}
      - name: Reject unsafe preview artifact entries
        run: |
          if find preview-artifact -type l -print -quit | grep -q .; then
            echo "Preview artifact contains a symbolic link." >&2
            exit 1
          fi
      - name: Assemble production and preview
        run: |
          mkdir -p site/preview
          cp -R source-main/apps/client/.output/public/. site/
          cp -R preview-artifact/. site/preview/
          if [ -f source-main/.github/pages/404.html ]; then
            cp source-main/.github/pages/404.html site/404.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
