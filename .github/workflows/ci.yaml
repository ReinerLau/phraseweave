name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  NODE_VERSION: 20.12.2

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F client type-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://test:password@localhost:5480/phraseweave_test
      SECRET: test-only-secret
      REDIS_URL: redis://127.0.0.1:6379
    services:
      pg:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: phraseweave_test
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U test -d phraseweave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6.2.5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:init:test:ci
      - run: pnpm schema:build
      - run: pnpm test:ci

  static-build:
    name: static-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:client
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /phraseweave/preview/
          DEPLOYMENT_ENVIRONMENT: preview
          BUILD_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}

  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Cypress browser
        run: pnpm -F client exec cypress install
      - name: Build preview
        run: pnpm build:client
        env:
          NODE_ENV: production
          NUXT_APP_BASE_URL: /phraseweave/preview/
          DEPLOYMENT_ENVIRONMENT: preview
          BUILD_SHA: ${{ github.sha }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
      - name: Assemble preview path
        run: |
          mkdir -p "$RUNNER_TEMP/phraseweave-smoke/phraseweave/preview"
          cp -R apps/client/.output/public/. "$RUNNER_TEMP/phraseweave-smoke/phraseweave/preview/"
      - name: Smoke-test generated application
        run: >-
          pnpm -F client exec start-server-and-test
          "pnpm exec serve $RUNNER_TEMP/phraseweave-smoke --listen 3000 --no-port-switching"
          http://127.0.0.1:3000/phraseweave/preview/
          "pnpm test:smoke --config baseUrl=http://127.0.0.1:3000/phraseweave/preview/"

  release-readiness:
    name: release-readiness
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every included requirement was accepted
        run: node .github/scripts/verify-release-readiness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
